services:
  - type: web
    name: finance-backend
    env: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_SERVER
        fromDatabase:
          name: finance-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: finance-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: finance-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: finance-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: finance-db
          property: password

databases:
  - name: finance-db
    databaseName: finance
    user: finance_admin
